# Gossoko for Mac: a native SwiftUI app (Peta 14 Nov 2026: Mac apps are native, never Electron).
# A WKWebView shell around https://sinsera.co/gossoko/admin/ (same site the phones load).
#   cd native/mac && xcodegen generate && xcodebuild -scheme Gossoko -configuration Release build
name: Gossoko
options:
  bundleIdPrefix: com.sinsera
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: 3R7FM9TSMX
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Gossoko:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - Gossoko.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sinsera.gossoko
        PRODUCT_NAME: Gossoko
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gossoko
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSHumanReadableCopyright: Sinsera
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: Gossoko uses Touch ID to unlock the app when you turn on Require Touch ID at Launch.
        CODE_SIGN_ENTITLEMENTS: Sources/Gossoko.entitlements
